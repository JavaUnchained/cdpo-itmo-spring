spring.application.name=Tech Service

server.port=8008

spring.profiles.active=feign
#db settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/service
spring.datasource.username=service_user
spring.datasource.password=service_password

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


security.jwtSecret=mySuperSecretKey
security.jwtRefreshSecret=myRefreshSecretKey
security.jwtSecretExpiration=360000000

notification.enable=false